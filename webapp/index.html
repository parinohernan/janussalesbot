<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Código de Barras Venta</title>
    <!-- Incluye el script oficial de Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Incluye la librería html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Enlaza la hoja de estilos CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos inline eliminados - ahora están en style.css */
    </style>
</head>
<body>
    <div class="container">
        <h1>Registrar Venta</h1>
        <p>Apunta la cámara al código de barras del producto.</p>

        <!-- Contenedor donde se renderizará el escáner -->
        <div id="reader"></div>
        <button id="restart-scan-button" style="display: none; margin-top: 10px;">🔍 Escanear Siguiente</button>

        <!-- Sección para pedir cantidad (oculta inicialmente) -->
        <div id="quantity-prompt" style="display: none; margin-top: 15px; padding: 15px; border: 1px solid #ccc; border-radius: 5px;">
            <p><strong>Código:</strong> <span id="scanned-code"></span></p>
            <label for="quantity-input">Cantidad:</label>
            <input type="number" id="quantity-input" value="1" min="1" style="width: 60px; margin: 0 10px;">
            <button id="confirm-quantity">Añadir</button>
            <button id="cancel-quantity" style="margin-left: 5px;">Cancelar</button>
        </div>

        <div id="qr-result">Esperando escaneo...</div>
    </div>

    <!-- Lista de Items -->
    <div class="item-list-container">
        <h2>Lista de Compra</h2>
        <ul id="item-list"></ul>
    </div>

    <!-- Entrada Manual -->
    <div class="manual-entry-container">
        <h2>Entrada Manual</h2>
        <input type="text" id="manual-barcode" placeholder="Código de barras">
        <input type="number" id="manual-quantity" placeholder="Cantidad" value="1" min="1" style="width: 80px;">
        <button id="manual-add-button">+</button>
    </div>

    <!-- Botón Finalizar (preparado) -->
    <div style="text-align: center; margin-top: 25px;">
        <button id="finalize-button">✅ Finalizar Venta</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
